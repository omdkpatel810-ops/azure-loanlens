<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ s.brand }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="staff">
  <header class="top">
    <a class="brand" href="/">{{ s.brand }}</a>
    <nav>
      <a href="{{ switch_url }}" lang="{{ s.other_lang }}">{{ s.switch }}</a>
      {% if user %}
        <span class="who">{{ t.signed_in_as }} <b>{{ user.name }}</b></span>
        <a href="{{ sign_out }}">{{ t.sign_out }}</a>
      {% endif %}
    </nav>
  </header>
  <main class="wide">
    {% block main %}{% endblock %}
  </main>
</body>
</html>
