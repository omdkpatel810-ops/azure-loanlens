<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ t.title }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">LoanLens</a>
    <nav>
      <a href="{{ switch_url }}" lang="{{ t.other_lang }}">{{ t.switch }}</a>
      {% if user %}
        <span class="who">{{ t.signed_in_as }} <b>{{ user.name }}</b></span>
        <a href="{{ sign_out }}">{{ t.sign_out }}</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% block main %}{% endblock %}
  </main>
  <footer><p>{{ t.privacy }}</p></footer>
</body>
</html>
