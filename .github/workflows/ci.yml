# Offline checks on every push and pull request. Nothing here needs an Azure account.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python, against Azurite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Start Azurite (Azure Storage on this machine)
        run: |
          npx --yes azurite@3.37.0 --silent --inMemoryPersistence --skipApiVersionCheck &
          for i in $(seq 30); do nc -z 127.0.0.1 10000 && exit 0; sleep 1; done
          echo "Azurite didn't start" && exit 1
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov --cov-fail-under=100

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: terraform test (mocked providers)
        run: terraform test

  lint:
    name: tflint and Checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.59.1
      - run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --chdir=infra --config="$PWD/.tflint.hcl"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: checkov --directory . --framework terraform github_actions dockerfile --compact --quiet

  image:
    name: Portal image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build --tag loanlens:ci .
      - name: The image starts and answers its health check
        run: |
          docker run --detach --name portal -p 8000:8000 -e LOANLENS_AUTH=easyauth -e LOANLENS_STORAGE_ACCOUNT=stexample loanlens:ci
          for i in $(seq 20); do curl -fsS http://127.0.0.1:8000/healthz && exit 0; sleep 1; done
          docker logs portal && exit 1
